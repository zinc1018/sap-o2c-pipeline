name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check

      - name: Test
        run: uv run pytest

      - name: Run the pipeline end to end
        run: |
          uv run generate --days 30
          uv run load
          uv run generate --days 5
          uv run load

      - name: Build dbt models and tests
        working-directory: dbt
        run: uv run dbt build
