[project]
name = "sap-o2c-pipeline"
version = "0.1.0"
description = "SAP order-to-cash analytics pipeline: generator, loader, dbt, Dagster"
requires-python = ">=3.12"
dependencies = ["duckdb"]

[project.scripts]
generate = "generator.cli:main"
load = "loader.cli:main"

[dependency-groups]
dev = [
    "dbt-duckdb>=1.11.0",
    "pytest",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["generator", "loader"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
